<section class="person-results">
    <header class="person-results__header">
        <button
            type="button"
            class="person-results__back"
            aria-label="Back"
            (click)="goBack()"
        >
            <mat-icon>arrow_back</mat-icon>
        </button>
        <div class="person-results__title-block">
            <span class="person-results__eyebrow">
                {{ getRoleLabelKey(role()) | translate }}
            </span>
            <h1>{{ personName() }}</h1>
            <p>
                {{
                    'XTREAM.PERSON_RESULTS_SUBTITLE'
                        | translate: { count: items().length }
                }}
            </p>
        </div>
    </header>

    @if (error(); as errorKey) {
        <div class="person-results__notice">
            {{ errorKey | translate }}
        </div>
    }

    <app-grid-list
        [items]="items()"
        [isLoading]="isLoading()"
        [showPaginator]="false"
        (itemClicked)="openMovie($event)"
    />
</section>
